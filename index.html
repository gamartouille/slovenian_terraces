<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Terrace Viewer — Leaflet</title>

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- JSZip -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<!-- Shapefile.js -->
<script src="https://unpkg.com/shapefile@0.6.6/dist/shapefile.js"></script>
<!-- shpjs fallback (needed for zip+shp loading) -->
<script src="https://unpkg.com/shpjs@latest/dist/shp.js"></script>

<!-- GeoTIFF natif (pas besoin de georaster ou georaster-layer-for-leaflet) -->
<script src="https://cdn.jsdelivr.net/npm/geotiff@2.1.3/dist-browser/geotiff.js"></script>

<!-- chroma.js for colorscale -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/chroma-js/2.4.2/chroma.min.js"></script>
<!-- proj4js pour reprojection MNT -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>

<!-- GeoPackage -->
<script src="https://cdn.jsdelivr.net/npm/@ngageoint/geopackage@4.2.3/dist/geopackage.min.js"></script>

<link rel="stylesheet" href="/src/cezscoka_terrace.css" />
</head>
<body>

<div id="map"></div>

<div id="panel">
  <div id="panel-header">
    <h1><span>⬡</span> Terrace Viewer</h1>
    <div id="panel-subtitle">Leaflet · GeoTIFF · Shapefile · GeoPackage</div>
  </div>

  <!-- Zoom rapide -->
  <div id="zoom-zone">
    <label>Quick Zoom</label>
    <div class="zoom-row">
      <button class="btn zoom-btn" onclick="zoomToBovec()">
        <span class="zoom-icon">◎</span> Bovec Terrace
      </button>
      <button class="btn zoom-btn" onclick="zoomToGrgaske()">
        <span class="zoom-icon">◎</span> Grgaske-Dragovica
      </button>
    </div>
  </div>

  <!-- Vector upload -->
  <div id="upload-zone">
    <label>Add Vector Layer</label>
    <div class="upload-row">
      <button class="btn" onclick="document.getElementById('file-input').click()">📂 Local File</button>
    </div>
    <input type="file" id="file-input" accept=".zip,.gpkg,.shp,.geojson,.json" multiple />
    <div class="upload-row">
      <input id="url-input" type="text" placeholder="URL .zip / .gpkg / ArcGIS…" />
      <button class="btn primary" onclick="loadFromUrl()">↓</button>
    </div>
  </div>

  <!-- MNT/GeoTIFF -->
  <div id="mnt-zone">
    <label>🏔 DEM / GeoTIFF (.tif / .tiff)</label>
    <div id="mnt-options">
      <select id="mnt-colorscale">
        <option value="terrain">Palette : Terrain</option>
        <option value="viridis">Palette : Viridis</option>
        <option value="inferno">Palette : Inferno</option>
        <option value="RdYlGn">Palette : RdYlGn</option>
        <option value="spectral" selected>Palette : Spectral</option>
        <option value="earth">Palette : Earth</option>
      </select>
    </div>
    <div class="upload-row" style="margin-top:6px;">
      <button class="btn" onclick="document.getElementById('mnt-input').click()">📂 Load DEM</button>
    </div>
    <input type="file" id="mnt-input" accept=".tif,.tiff" />
    <div id="mnt-legend">
      <canvas id="mnt-legend-canvas"></canvas>
      <div id="mnt-legend-labels">
        <span id="mnt-min">—</span>
        <span id="mnt-max">—</span>
      </div>
    </div>
  </div>

  <div id="layers-section">
    <div id="layers-label">Active layers</div>
    <div id="layers-list"><p style="font-size:11px;color:var(--muted);font-family:var(--mono);">Loading…</p></div>
  </div>
</div>

<div id="toast"></div>
<div id="spinner"><div id="spinner-ring"></div><div id="spinner-msg">Loading…</div></div>
<div id="tooltip"></div>

<script type="module" src="./cezscoka_terrace_leaflet.js"></script></body>
</html>
